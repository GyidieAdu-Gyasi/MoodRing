<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mood Selector</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app-container">
    <h1>How are you feeling today?</h1>

    <div id="mood-display">
      <h2 id="mood-message">Select a mood...</h2>
      <div id="mood-icon"></div>
    </div>

    <div class="button-container">
      <button class="mood-btn" id="happy">Happy</button>
      <button class="mood-btn" id="sad">Sad</button>
      <button class="mood-btn" id="angry">Angry</button>
      <button class="mood-btn" id="confused">Confused</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
